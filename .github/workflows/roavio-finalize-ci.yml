name: Roavio final proposal CI

on:
  push:
    branches: [proposal/roavio-ne-datafix]
    paths:
      - ".github/workflows/roavio-finalize-ci.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne-datafix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align proposal copy and nav with mapped catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('app/page.tsx')
          text = home.read_text()
          text = text.replace('● 80 cities · 6 continents · data updated 2026', '● 90 cities · 6 continents · data updated 2026')
          text = text.replace('["80", "indexed cities", "var(--rv-lime)"]', '["90", "indexed cities", "var(--rv-lime)"]')
          home.write_text(text)

          theme = Path('app/roavio/theme.ts')
          text = theme.read_text()
          explore = '      { label: "Explorar", href: "/cities", cprop: { link: { transition: "fade" } } },\n'
          match = '      { label: "Match", href: "/match", cprop: { link: { transition: "fade" } } },\n'
          if match not in text:
              if explore not in text:
                  raise SystemExit('Roavio nav anchor not found')
              text = text.replace(explore, explore + match, 1)
          theme.write_text(text)
          PY
      - name: Verify city content tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(find content/cities -mindepth 1 -maxdepth 1 -type d ! -name '.*' ! -name '_*' | wc -l)" -eq 90
          test "$(find content/cities -mindepth 2 -maxdepth 2 -type f -name city.json ! -path '*/_*/*' ! -path '*/.*/*' | wc -l)" -eq 90
          test "$(find content/cities -mindepth 2 -maxdepth 2 -type f -name guide.md ! -path '*/_*/*' ! -path '*/.*/*' | wc -l)" -eq 90
          test ! -d content/cities/.scrape
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npx next build
      - name: Commit final proposal alignment
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/roavio/theme.ts
          if git diff --cached --quiet; then
            echo "Proposal copy already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align Roavio proposal with 90-city catalog"
          git push origin HEAD:proposal/roavio-ne-datafix
