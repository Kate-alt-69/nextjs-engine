name: Roavio media repair CI

on:
  push:
    branches:
      - proposal/roavio-ne

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'ci: materialize and validate Roavio city media'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize two public city photos for all 90 destinations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.resolve('content/cities');
          const outPath = path.resolve('app/roavio/city-media.generated.json');
          const UA = 'RoavioProposal/1.0 (https://github.com/Kate-alt-69/nextjs-engine; public city media materializer)';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const reject = /\b(flag|map|locator|location|seal|coat[ _-]?of[ _-]?arms|logo|icon|diagram|route|metro|subway|districts?|boroughs?|portrait|player|athlete|politician|mayor|president|football|rugby|cricket|marathon|runner|race|team|jersey|medal|election|signature)\b/i;
          const secondaryHint = /\b(street|avenue|boulevard|architecture|landmark|monument|tower|mosque|cathedral|church|temple|palace|castle|fort|museum|square|plaza|bridge|gate|old[ _-]?town|historic|heritage|waterfront|marina|corniche|promenade|market|bazaar|garden|park|beach)\b/i;
          const primaryHint = /\b(skyline|cityscape|panorama|panoramic|aerial|downtown|waterfront|harbou?r|city|urban|bay)\b/i;
          const aliases = {
            'abu dabi':'Abu Dhabi','addis abeba':'Addis Ababa','aman':'Amman','atenas':'Athens','belgrado':'Belgrade',
            'ciudad de mexico':'Mexico City','ciudad del cabo':'Cape Town','copenhague':'Copenhagen','cracovia':'Kraków',
            'dubai':'Dubai','el cairo':'Cairo','estambul':'Istanbul','florencia':'Florence','hanoi':'Hanoi',
            'ho chi minh':'Ho Chi Minh City','liubliana':'Ljubljana','londres':'London','mascate':'Muscat','milan':'Milan',
            'munich':'Munich','oporto':'Porto','panama':'Panama City','pekin':'Beijing','praga':'Prague','roma':'Rome',
            'seul':'Seoul','sevilla':'Seville','shanghai':'Shanghai','sidney':'Sydney','singapur':'Singapore','sofia':'Sofia',
            'taipei':'Taipei','tallin':'Tallinn','tiflis':'Tbilisi','tokio':'Tokyo','varsovia':'Warsaw','viena':'Vienna','yakarta':'Jakarta'
          };

          function folded(value) {
            return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[_-]+/g, ' ').toLowerCase().trim();
          }
          function useful(info) {
            if (!info) return false;
            if (info.mime && !/^image\/(?:jpeg|png|webp|avif)$/i.test(info.mime)) return false;
            const w = info.thumbwidth || info.width || 0;
            const h = info.thumbheight || info.height || 0;
            if (w && h && (w < 520 || h < 280 || w / h < .72 || w / h > 3.8)) return false;
            return Boolean(info.thumburl || info.url);
          }
          async function fetchJson(url, attempt = 0) {
            const response = await fetch(url, { headers: { Accept: 'application/json', 'User-Agent': UA } });
            if ((response.status === 429 || response.status >= 500) && attempt < 5) {
              const wait = Math.min(5000, 500 * (2 ** attempt));
              console.log(`  upstream ${response.status}; retrying in ${wait}ms`);
              await sleep(wait);
              return fetchJson(url, attempt + 1);
            }
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
            const json = await response.json();
            await sleep(120);
            return json;
          }
          async function wikiSearch(language, query) {
            const params = new URLSearchParams({
              action:'query', generator:'search', gsrsearch:query, gsrnamespace:'0', gsrlimit:'6',
              prop:'pageimages|images', piprop:'thumbnail|name', pithumbsize:'1600', imlimit:'100',
              format:'json', formatversion:'2', origin:'*'
            });
            const data = await fetchJson(`https://${language}.wikipedia.org/w/api.php?${params}`);
            return data.query?.pages || [];
          }
          async function commonsInfo(titles) {
            const output = [];
            for (let start = 0; start < titles.length; start += 40) {
              const batch = titles.slice(start, start + 40);
              const params = new URLSearchParams({
                action:'query', titles:batch.join('|'), prop:'imageinfo', iiprop:'url|mime|size',
                iiurlwidth:'1600', format:'json', formatversion:'2', origin:'*'
              });
              const data = await fetchJson(`https://commons.wikimedia.org/w/api.php?${params}`);
              for (const page of data.query?.pages || []) {
                const info = page.imageinfo?.[0];
                if (page.title && useful(info)) output.push({ title:page.title, ...info });
              }
            }
            return output;
          }
          async function commonsSearch(query) {
            const params = new URLSearchParams({
              action:'query', generator:'search', gsrsearch:query, gsrnamespace:'6', gsrlimit:'20',
              prop:'imageinfo', iiprop:'url|mime|size', iiurlwidth:'1600', format:'json', formatversion:'2', origin:'*'
            });
            const data = await fetchJson(`https://commons.wikimedia.org/w/api.php?${params}`);
            return (data.query?.pages || []).map((page) => ({ title:page.title, ...(page.imageinfo?.[0] || {}) })).filter((entry) => useful(entry));
          }
          function imageScore(item, city, slot) {
            const title = item.title || '';
            if (reject.test(title) || /\.svg(?:$|\?)/i.test(title)) return -1000;
            const t = folded(title);
            const c = folded(city);
            let score = 0;
            if (t.includes(c)) score += 24;
            if (slot === 0 && primaryHint.test(t)) score += 18;
            if (slot === 1 && secondaryHint.test(t)) score += 22;
            if (slot === 1 && primaryHint.test(t)) score += 4;
            const w = item.thumbwidth || item.width || 0;
            const h = item.thumbheight || item.height || 0;
            if (w >= 1200) score += 4;
            if (w && h && w / h >= 1.15 && w / h <= 2.5) score += 5;
            return score;
          }
          function srcOf(item) { return item?.thumburl || item?.url || null; }
          function pick(items, city, slot, exclude = new Set()) {
            return [...items]
              .filter((item) => !exclude.has(srcOf(item)))
              .map((item) => ({ item, score:imageScore(item, city, slot) }))
              .filter((entry) => entry.score > -100)
              .sort((a,b) => b.score - a.score)
              .map((entry) => entry.item)[0] || null;
          }

          const dirs = fs.readdirSync(root, { withFileTypes:true })
            .filter((entry) => entry.isDirectory() && entry.name !== '_template' && !entry.name.startsWith('.'))
            .map((entry) => entry.name).sort();
          if (dirs.length !== 90) throw new Error(`Expected 90 cities, found ${dirs.length}`);

          const manifest = { version:1, generatedAt:new Date().toISOString(), cities:{} };
          const failures = [];

          for (let index = 0; index < dirs.length; index += 1) {
            const slug = dirs[index];
            const data = JSON.parse(fs.readFileSync(path.join(root, slug, 'city.json'), 'utf8'));
            const city = data.name;
            const country = data.country;
            const alias = aliases[folded(city)] || city;
            let pool = [];
            let pageCandidates = [];

            for (const language of ['en','es']) {
              try {
                const pages = await wikiSearch(language, alias);
                const rankedPages = [...pages].sort((a,b) => {
                  const score = (page) => {
                    const title = folded(page.title || '');
                    const target = folded(alias);
                    let value = title === target ? 50 : title.includes(target) ? 30 : 0;
                    if (page.thumbnail?.source && !reject.test(page.pageimage || '')) value += 15;
                    return value;
                  };
                  return score(b) - score(a);
                });
                pageCandidates.push(...rankedPages.map((page) => ({ language, page })));
                const imageTitles = rankedPages.slice(0,2).flatMap((page) => page.images || []).map((image) => image.title).filter(Boolean);
                if (imageTitles.length) pool.push(...await commonsInfo([...new Set(imageTitles)].slice(0,60)));
              } catch (error) {
                console.log(`  ${slug}: ${language} Wikipedia lookup failed: ${error.message}`);
              }
              if (pageCandidates.some(({page}) => page.thumbnail?.source) && pool.length >= 8) break;
            }

            const leadItems = pageCandidates
              .filter(({page}) => page.thumbnail?.source && !reject.test(page.pageimage || '') && !/\.svg(?:$|\?)/i.test(page.pageimage || ''))
              .map(({page}) => ({
                title: page.pageimage || page.title || city,
                thumburl: page.thumbnail.source,
                thumbwidth: page.thumbnail.width,
                thumbheight: page.thumbnail.height,
                mime: 'image/jpeg'
              }));
            pool.unshift(...leadItems);

            if (pool.length < 6) {
              try { pool.push(...await commonsSearch(`${alias} ${country}`)); } catch (error) { console.log(`  ${slug}: Commons search failed: ${error.message}`); }
            }
            const unique = [];
            const seen = new Set();
            for (const item of pool) {
              const src = srcOf(item);
              if (!src || seen.has(src) || reject.test(item.title || '') || /\.svg(?:$|\?)/i.test(item.title || '')) continue;
              seen.add(src);
              unique.push(item);
            }

            let primary = pick(unique, alias, 0);
            let secondary = pick(unique, alias, 1, new Set(primary ? [srcOf(primary)] : []));

            if (!primary || !secondary) {
              try {
                const extra = await commonsSearch(`${alias} ${country} skyline architecture`);
                for (const item of extra) {
                  const src = srcOf(item);
                  if (!src || seen.has(src) || reject.test(item.title || '')) continue;
                  seen.add(src); unique.push(item);
                }
                primary ||= pick(unique, alias, 0);
                secondary ||= pick(unique, alias, 1, new Set(primary ? [srcOf(primary)] : []));
              } catch (error) {
                console.log(`  ${slug}: secondary Commons search failed: ${error.message}`);
              }
            }

            const primarySource = srcOf(primary);
            const secondarySource = srcOf(secondary);
            if (!primarySource || !secondarySource || primarySource === secondarySource) {
              failures.push({ slug, city, country, primary:Boolean(primarySource), secondary:Boolean(secondarySource), candidates:unique.length });
              console.log(`${String(index+1).padStart(2,'0')}/90 ${slug} MISSING (${unique.length} candidates)`);
              continue;
            }

            manifest.cities[slug] = {
              city, country,
              primary: primarySource,
              secondary: secondarySource,
              primaryTitle: primary.title || null,
              secondaryTitle: secondary.title || null
            };
            console.log(`${String(index+1).padStart(2,'0')}/90 ${slug} ok`);
          }

          if (failures.length) {
            console.error('\nCould not materialize two distinct city photos for:', JSON.stringify(failures, null, 2));
            process.exit(1);
          }
          if (Object.keys(manifest.cities).length !== 90) throw new Error('Manifest is not complete');
          fs.writeFileSync(outPath, JSON.stringify(manifest, null, 2) + '\n');
          console.log(`\nMaterialized ${Object.keys(manifest.cities).length} cities / 180 distinct photo slots.`);
          NODE

      - name: Wire materialized media through EngineAPIResolver and animated likes
        shell: bash
        run: |
          cat > app/roavio/cityMedia.server.ts <<'EOF'
          import { EngineAPIResolver } from "@/engine";
          import mediaManifest from "./city-media.generated.json";

          type MediaEntry = {
            city: string;
            country: string;
            primary: string;
            secondary: string;
            primaryTitle?: string | null;
            secondaryTitle?: string | null;
          };

          const resolver = new EngineAPIResolver({
            method: "GET",
            cache: "force-cache",
            auth: { type: "none" },
            headers: {
              Accept: "image/avif,image/webp,image/*,*/*;q=0.7",
              "User-Agent": "RoavioProposal/1.0 (materialized city media via EngineAPIResolver)",
            },
          });

          function fold(value: string): string {
            return value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
          }

          const byCity = new Map<string, [string, MediaEntry]>();
          for (const [slug, entry] of Object.entries(mediaManifest.cities as Record<string, MediaEntry>)) {
            byCity.set(`${fold(entry.city)}|${fold(entry.country)}`, [slug, entry]);
            if (!byCity.has(`${fold(entry.city)}|`)) byCity.set(`${fold(entry.city)}|`, [slug, entry]);
          }

          function resizedWikimediaThumb(source: string, width: number): string {
            if (!source.includes("upload.wikimedia.org") || !source.includes("/thumb/")) return source;
            const bounded = Math.max(320, Math.min(1600, Math.round(width)));
            return source.replace(/\/\d+px-([^/?]+)(\?.*)?$/, `/${bounded}px-$1$2`);
          }

          export function getMaterializedCityPhoto(city: string, country: string, slot: number, width: number): { source: string; article: string } | null {
            const found = byCity.get(`${fold(city)}|${fold(country)}`) ?? byCity.get(`${fold(city)}|`);
            if (!found) return null;
            const [slug, entry] = found;
            const source = slot > 0 ? entry.secondary : entry.primary;
            if (!source) return null;
            return {
              source: resizedWikimediaThumb(source, width),
              article: `manifest:${slug}:${slot > 0 ? "secondary" : "primary"}`,
            };
          }

          export function fetchCityPhotoSource(source: string): Promise<Response> {
            return resolver.resolveRequest({ nodeOverrides: { endpoint: source } });
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          route = Path('app/api/city-photo/route.ts')
          text = route.read_text()
          anchor = 'import { NextRequest } from "next/server";\n'
          addition = anchor + 'import { fetchCityPhotoSource, getMaterializedCityPhoto } from "@/app/roavio/cityMedia.server";\n'
          assert anchor in text
          text = text.replace(anchor, addition, 1)
          old = '    "X-Roavio-Image-Source": "Wikipedia exact city article",\n'
          new = '    "X-Roavio-Image-Source": article.startsWith("manifest:") ? "materialized media manifest" : "Wikipedia exact city article",\n'
          assert old in text
          text = text.replace(old, new, 1)
          old = '  const city = request.nextUrl.searchParams.get("city")?.trim();\n  if (!city) return new Response("Missing city", { status: 400 });\n\n'
          new = '  const city = request.nextUrl.searchParams.get("city")?.trim();\n  if (!city) return new Response("Missing city", { status: 400 });\n  const country = request.nextUrl.searchParams.get("country")?.trim() ?? "";\n\n'
          assert old in text
          text = text.replace(old, new, 1)
          old = '  const resolved = await resolveImage(city, width, height, slot);\n'
          new = '  const resolved = getMaterializedCityPhoto(city, country, slot, width) ?? await resolveImage(city, width, height, slot);\n'
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    const upstream = await fetch(resolved.source, {
      next: { revalidate: CACHE_SECONDS },
      headers: { Accept: "image/avif,image/webp,image/*,*/*;q=0.7", "User-Agent": "RoavioProposal/1.0 (cached verified city photo proxy)" },
    });
'''
          new = '    const upstream = await fetchCityPhotoSource(resolved.source);\n'
          assert old in text
          text = text.replace(old, new, 1)
          route.write_text(text)

          widgets = Path('app/roavio/ClientWidgets.tsx')
          text = widgets.read_text()
          anchor = 'import { SearchableCitySelect } from "./SearchableCitySelect";\n'
          assert anchor in text
          text = text.replace(anchor, anchor + 'import { AnimatedLikeButton } from "./AnimatedLikeButton";\n', 1)
          old = '''    <article className="rv-result-card">
      <EngineTransitionLink href={cityHref} transition="portal" className="rv-result-card__visual" aria-label={`${copy.open} ${city.city}`}>
        <CityThumb slug={city.slug} city={city.city} country={city.country} />
      </EngineTransitionLink>
'''
          new = '''    <article className="rv-result-card">
      <div className="rv-result-card__visual-wrap">
        <EngineTransitionLink href={cityHref} transition="portal" className="rv-result-card__visual" aria-label={`${copy.open} ${city.city}`}>
          <CityThumb slug={city.slug} city={city.city} country={city.country} />
        </EngineTransitionLink>
        <AnimatedLikeButton active={favorite} onToggle={onFavorite} locale={locale} city={city.city} />
      </div>
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '          <button className="rv-icon-btn" type="button" data-active={favorite} onClick={onFavorite} aria-label={favorite ? copy.saved : copy.save}>{favorite ? `♥ ${copy.saved}` : `♡ ${copy.save}`}</button>\n'
          assert old in text
          text = text.replace(old, '', 1)
          widgets.write_text(text)

          thumb = Path('app/roavio/CityThumb.tsx')
          text = thumb.read_text().replace('const CITY_PHOTO_VERSION = "9";', 'const CITY_PHOTO_VERSION = "11";')
          thumb.write_text(text)
          backdrop = Path('app/roavio/CityDossierBackdrop.tsx')
          text = backdrop.read_text().replace('const PHOTO_VERSION = "10";', 'const PHOTO_VERSION = "11";')
          backdrop.write_text(text)

          css = Path('app/roavio/ux.css')
          text = css.read_text()
          marker = '/* Animated Explorer like control */'
          if marker not in text:
            text += r'''

/* Animated Explorer like control */
.rv-result-card__visual-wrap{position:relative;isolation:isolate}
.rv-city-like{
  position:absolute;top:.72rem;right:.72rem;z-index:7;width:42px;height:42px;padding:0;
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.52);border-radius:999px;
  background:rgba(7,20,15,.72);color:#f4fbf7;box-shadow:0 8px 24px rgba(0,0,0,.2);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;overflow:visible;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background .2s ease,border-color .2s ease,color .2s ease;
}
.rv-city-like:hover{transform:translateY(-1px) scale(1.05)}
.rv-city-like:active{transform:scale(.92)}
.rv-city-like[data-active='true']{background:var(--rv-lime);border-color:rgba(200,243,107,.95);color:#10231f}
.rv-city-like__thumb{position:relative;z-index:2;display:grid;place-items:center;width:22px;height:22px;transform-origin:50% 72%}
.rv-city-like[data-active='true'] .rv-city-like__thumb{animation:rv-like-pop .46s cubic-bezier(.18,.9,.24,1.35)}
.rv-city-like__burst{position:absolute;inset:-1px;z-index:1;width:44px;height:44px;pointer-events:none}
.rv-city-like__burst canvas,.rv-city-like__burst>div{width:44px!important;height:44px!important;background:transparent!important;pointer-events:none!important}
@keyframes rv-like-pop{0%{transform:scale(.72) rotate(-8deg)}48%{transform:scale(1.2) rotate(5deg)}72%{transform:scale(.96) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@media(max-width:700px){.rv-city-like{top:.6rem;right:.6rem;width:40px;height:40px}.rv-city-like__burst{width:42px;height:42px}}
@media(prefers-reduced-motion:reduce){.rv-city-like,.rv-city-like__thumb{transition:none!important;animation:none!important}}
'''
          css.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npx next build
      - name: Start production server
        shell: bash
        run: |
          (npm run start -- -p 3100 > /tmp/roavio-next.log 2>&1 &)
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3100/cities >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roavio-next.log
          exit 1
      - name: Sweep all 90 routes and 180 materialized photo slots
        env:
          ROAVIO_BASE_URL: http://127.0.0.1:3100
          ROAVIO_SWEEP_CONCURRENCY: "2"
          ROAVIO_SWEEP_TIMEOUT_MS: "20000"
        run: node tests/roavio-city-sweep.mjs
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add app/api/city-photo/route.ts app/roavio/city-media.generated.json app/roavio/cityMedia.server.ts app/roavio/ClientWidgets.tsx app/roavio/CityThumb.tsx app/roavio/CityDossierBackdrop.tsx app/roavio/ux.css
          git commit -m "fix: materialize all Roavio city media and animate likes"
          git push origin HEAD:proposal/roavio-ne
