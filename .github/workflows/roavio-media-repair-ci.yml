name: Roavio media repair CI

on:
  push:
    branches:
      - proposal/roavio-ne

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'ci: run Roavio media materialization'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize two photos for every Roavio city
        env:
          ROAVIO_MEDIA_PAUSE_MS: "220"
          ROAVIO_MEDIA_RETRIES: "6"
        run: node tests/roavio-media-materialize.mjs
      - name: Commit generated city media manifest
        shell: bash
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add app/roavio/city-media.generated.json
          if git diff --cached --quiet; then
            echo "Media manifest is already current."
            exit 0
          fi
          git commit -m "content: materialize Roavio city media"
          git push origin HEAD:proposal/roavio-ne
