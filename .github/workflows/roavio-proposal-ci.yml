name: Roavio proposal CI

on:
  push:
    branches: [proposal/roavio-ne]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run type-check
      - run: npx next build
