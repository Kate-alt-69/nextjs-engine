name: Roavio current fix

on:
  push:
    branches:
      - proposal/roavio-ne
    paths:
      - .github/workflows/roavio-current-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: proposal/roavio-ne
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply Roavio fixes
        run: python3 scripts/roavio-current-fix.py

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npx next build

      - name: Commit validated changes
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add app/page.tsx app/compare/page.tsx app/roavio/CityShowcase.tsx app/roavio/CityDossier.tsx app/roavio/PreferencesShell.tsx app/roavio/theme.ts app/roavio/city-hero.css app/roavio/ux.css app/roavio/responsive-v2.css app/roavio/CityDossierMedia.tsx
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "perf: streamline Roavio homepage and city intro"
            git push origin HEAD:proposal/roavio-ne
          fi
