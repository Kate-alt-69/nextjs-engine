name: Roavio final performance validation

on:
  push:
    branches:
      - proposal/roavio-ne
    paths:
      - .github/workflows/roavio-current-fix.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run type-check
      - run: npx next build
