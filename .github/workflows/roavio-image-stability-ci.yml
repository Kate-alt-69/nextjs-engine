name: Roavio image stability CI

on:
  push:
    branches: [proposal/roavio-ne]
    paths:
      - "src/engine/components/EngineImage.tsx"
      - "app/roavio/CityThumb.tsx"
      - "app/roavio/MatchQuiz.tsx"
      - "app/loading.tsx"
      - ".github/workflows/roavio-image-stability-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run type-check
      - run: npx next build
