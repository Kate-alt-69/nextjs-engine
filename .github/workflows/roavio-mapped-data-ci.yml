name: Roavio mapped content CI

on:
  push:
    branches: [proposal/roavio-ne-datafix]
    paths:
      - "content/cities/.scrape/mapped-v2.br.b64"
      - "scripts/roavio-materialize-scrape.js"
      - ".github/workflows/roavio-mapped-data-ci.yml"

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne-datafix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize exact mapped snapshot
        run: node scripts/roavio-materialize-scrape.js --force
      - name: Verify generated catalog
        shell: bash
        run: |
          set -euo pipefail
          test "$(find content/cities -mindepth 1 -maxdepth 1 -type d ! -name '.*' ! -name '_*' | wc -l)" -eq 90
          test "$(find content/cities -mindepth 2 -maxdepth 2 -name city.json | wc -l)" -eq 90
          test "$(find content/cities -mindepth 2 -maxdepth 2 -name guide.md | wc -l)" -eq 90
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npx next build
      - name: Commit generated city content
        shell: bash
        run: |
          set -euo pipefail
          git add content/cities
          if git diff --cached --quiet; then
            echo "Mapped city content is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: materialize 90 mapped Roavio city guides"
          git push origin HEAD:proposal/roavio-ne-datafix
