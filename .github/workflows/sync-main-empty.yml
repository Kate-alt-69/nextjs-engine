name: Sync main-empty package branch

on:
  push:
    branches:
      - main
    paths:
      - "src/engine/**"
      - "docs/**"
      - "DOCUMENT.md"
      - ".github/workflows/sync-main-empty.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-empty
  cancel-in-progress: true

jobs:
  sync-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1

      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          ref: main-empty
          path: package
          fetch-depth: 1

      - name: Mirror engine and documentation
        shell: bash
        run: |
          set -euo pipefail

          test -d source/src/engine
          test -d source/docs
          test -f source/DOCUMENT.md
          test -f package/package.json
          test -f package/index.ts

          rm -rf package/engine package/docs
          mkdir -p package/engine package/docs

          rsync -a --delete source/src/engine/ package/engine/
          rsync -a --delete source/docs/ package/docs/
          cp source/DOCUMENT.md package/DOCUMENT.md

          node - <<'NODE'
          const fs = require("fs");
          const packagePath = "./package/package.json";
          const packageJson = require(packagePath);
          if (packageJson.name !== "nextjs-engine") {
            throw new Error(`Refusing to sync unexpected package: ${packageJson.name}`);
          }

          const serverExport = packageJson.exports?.["./server"];
          if (!serverExport || serverExport.import !== "./engine/server.ts") {
            throw new Error("Package must export nextjs-engine/server from ./engine/server.ts");
          }
          if (!fs.existsSync("./package/engine/server.ts")) {
            throw new Error("Package server export points to a missing engine/server.ts");
          }
          if (!fs.existsSync("./package/engine/plugins/engineApiPlugin.js")) {
            throw new Error("Package is missing engineApiPlugin.js");
          }
          if (!fs.existsSync("./package/engine/plugins/apiStaticCompiler.js")) {
            throw new Error("Package is missing apiStaticCompiler.js");
          }

          packageJson.exports = packageJson.exports || {};
          packageJson.exports["./plugin"] = {
            require: "./engine/plugins/engineApiPlugin.js",
            default: "./engine/plugins/engineApiPlugin.js"
          };

          const typescriptVersion = packageJson.dependencies?.typescript
            || packageJson.devDependencies?.typescript
            || "^5.9.3";
          packageJson.dependencies = {
            ...(packageJson.dependencies || {}),
            typescript: typescriptVersion
          };
          if (packageJson.devDependencies) delete packageJson.devDependencies.typescript;

          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, "\t")}\n`, "utf8");
          NODE

      - name: Validate package branch
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run type-check
          npm run pack:check

      - name: Commit package update
        working-directory: package
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- engine docs DOCUMENT.md package.json

          if git diff --cached --quiet; then
            echo "main-empty is already synchronized"
            exit 0
          fi

          git commit -m "Sync package sources from main ${GITHUB_SHA::7}"
          git push origin HEAD:main-empty
