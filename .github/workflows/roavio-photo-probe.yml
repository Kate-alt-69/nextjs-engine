name: Roavio photo probe

on:
  push:
    branches: [proposal/roavio-ne]
    paths:
      - "app/api/city-photo/**"
      - ".github/workflows/roavio-photo-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact city article media
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const cities = ['Abu Dabi','Doha','Wellington','Copenhague'];
          const reject = /\b(flag|map|locator|location|seal|coat[ _-]?of[ _-]?arms|logo|icon|diagram|route|metro|subway|districts?|boroughs?|portrait|player|athlete|politician|mayor|president|football|rugby|cricket|marathon|runner|race|team|jersey|medal|election|signature)\b/i;
          const hints = /\b(skyline|cityscape|panorama|panoramic|aerial|downtown|waterfront|harbou?r|corniche|street|avenue|boulevard|old[ _-]?town|centre|center|architecture|tower|towers|landmark|mosque|cathedral|temple|palace|square|plaza|bay|beach|marina|river|bridge|night|city|urban)\b/i;
          const fold = (v) => v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[_-]+/g,' ').toLowerCase();
          const score = (title, city) => {
            if (reject.test(title) || /\.svg$/i.test(title)) return -1000;
            const t=fold(title), c=fold(city); let s=hints.test(t)?8:0;
            if(t.includes(c)) s+=12;
            if(/\b(skyline|cityscape|panorama|aerial|downtown|waterfront|harbou?r|corniche)\b/i.test(t)) s+=8;
            if(/\b(street|architecture|landmark|square|plaza|marina|bridge|old town)\b/i.test(t)) s+=4;
            return s;
          };
          async function page(city){
            const p=new URLSearchParams({action:'query',titles:city,redirects:'1',prop:'pageimages|images',piprop:'thumbnail|name',pithumbsize:'960',imlimit:'100',format:'json',formatversion:'2',origin:'*'});
            const r=await fetch(`https://es.wikipedia.org/w/api.php?${p}`,{headers:{'User-Agent':'RoavioProposal/1.0 photo probe'}});
            const d=await r.json(); return d.query?.pages?.find((x)=>!x.missing&&x.ns===0);
          }
          (async()=>{
            for(const city of cities){
              const p=await page(city); if(!p) throw new Error(`${city}: no article`);
              const leadSafe=p.pageimage && !reject.test(p.pageimage) && !/\.svg$/i.test(p.pageimage);
              const candidates=(p.images||[]).map(x=>({title:x.title,score:score(x.title,city)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
              const chosen=leadSafe?p.pageimage:candidates[0]?.title;
              if(!chosen) throw new Error(`${city}: no safe photo candidate`);
              console.log(`${city} -> ${p.title} -> ${chosen}`);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
