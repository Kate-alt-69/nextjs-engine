name: Roavio photo probe

on:
  push:
    branches: [proposal/roavio-ne]
    paths:
      - "app/api/city-photo/**"
      - "app/roavio/CityThumb.tsx"
      - "app/roavio/CityDossierBackdrop.tsx"
      - ".github/workflows/roavio-photo-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - name: Audit all city photo candidates
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs=require('fs'); const path=require('path');
          const root=path.join(process.cwd(),'content','cities');
          const cities=fs.readdirSync(root,{withFileTypes:true})
            .filter(e=>e.isDirectory()&&!e.name.startsWith('_')&&!e.name.startsWith('.'))
            .map(e=>JSON.parse(fs.readFileSync(path.join(root,e.name,'city.json'),'utf8')).name)
            .filter(Boolean);
          const reject=/\b(flag|map|locator|location|seal|coat[ _-]?of[ _-]?arms|logo|icon|diagram|route|metro|subway|districts?|boroughs?|portrait|player|athlete|politician|mayor|president|football|rugby|cricket|marathon|runner|race|team|jersey|medal|election|signature)\b/i;
          const hints=/\b(skyline|cityscape|panorama|panoramic|aerial|downtown|waterfront|harbou?r|corniche|street|avenue|boulevard|old[ _-]?town|centre|center|architecture|tower|towers|landmark|mosque|cathedral|temple|palace|square|plaza|bay|beach|marina|river|bridge|night|city|urban)\b/i;
          const fold=v=>v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[_-]+/g,' ').toLowerCase();
          const score=(title,city)=>{if(reject.test(title)||/\.svg$/i.test(title))return-1000;const t=fold(title),c=fold(city);let s=hints.test(t)?8:0;if(t.includes(c))s+=12;if(/\b(skyline|cityscape|panorama|aerial|downtown|waterfront|harbou?r|corniche)\b/i.test(t))s+=16;if(/\b(street|architecture|landmark|square|plaza|marina|bridge|old town)\b/i.test(t))s+=7;return s};
          async function page(lang,city){const p=new URLSearchParams({action:'query',titles:city,redirects:'1',prop:'pageimages|images',piprop:'thumbnail|name',pithumbsize:'960',imlimit:'100',format:'json',formatversion:'2',origin:'*'});const r=await fetch(`https://${lang}.wikipedia.org/w/api.php?${p}`,{headers:{'User-Agent':'RoavioProposal/1.0 catalog photo audit'}});if(!r.ok)return null;const d=await r.json();return d.query?.pages?.find(x=>!x.missing&&x.ns===0)||null}
          async function audit(city){
            let best=null;
            for(const lang of ['es','en']){
              const p=await page(lang,city); if(!p)continue;
              const leadSafe=p.pageimage&&!reject.test(p.pageimage)&&!/\.svg$/i.test(p.pageimage)&&p.thumbnail?.source;
              if(leadSafe){const c={lang,title:p.title,file:p.pageimage,score:100};if(!best||c.score>best.score)best=c}
              for(const img of p.images||[]){const s=score(img.title,city);if(s<=0)continue;const c={lang,title:p.title,file:img.title,score:55+s};if(!best||c.score>best.score)best=c}
            }
            return {city,best};
          }
          (async()=>{
            const results=[]; let cursor=0;
            async function worker(){while(cursor<cities.length){const city=cities[cursor++];try{results.push(await audit(city))}catch(e){results.push({city,best:null,error:String(e)})}}}
            await Promise.all(Array.from({length:5},()=>worker()));
            const missing=results.filter(r=>!r.best);
            console.log(`VERIFIED_CITY_PHOTO_COVERAGE ${results.length-missing.length}/${results.length}`);
            for(const name of ['Abu Dabi','Doha','Wellington','Copenhague']){const r=results.find(x=>x.city===name);console.log('PROBE',name,'=>',r?.best||'missing')}
            if(missing.length){console.log('MISSING',missing.map(r=>r.city).join(' | '));process.exit(1)}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
