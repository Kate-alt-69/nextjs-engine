name: Roavio photo probe

on:
  push:
    branches: [proposal/roavio-ne]
    paths:
      - "app/api/city-photo/**"
      - "app/roavio/CityThumb.tsx"
      - "app/roavio/CityDossierBackdrop.tsx"
      - ".github/workflows/roavio-photo-probe.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npx next build
      - name: Verify known-bad city articles now resolve to city media
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const cities=['Abu Dabi','Doha','Wellington','Copenhague'];
          const reject=/\b(flag|map|locator|location|seal|coat[ _-]?of[ _-]?arms|logo|icon|diagram|route|metro|subway|districts?|boroughs?|portrait|player|athlete|politician|mayor|president|football|rugby|cricket|marathon|runner|race|team|jersey|medal|election|signature)\b/i;
          async function page(lang,city){const p=new URLSearchParams({action:'query',titles:city,redirects:'1',prop:'pageimages|images',piprop:'thumbnail|name',pithumbsize:'960',imlimit:'100',format:'json',formatversion:'2',origin:'*'});const r=await fetch(`https://${lang}.wikipedia.org/w/api.php?${p}`,{headers:{'User-Agent':'RoavioProposal/1.0 final city probe'}});if(!r.ok)return null;const d=await r.json();return d.query?.pages?.find(x=>!x.missing&&x.ns===0)||null}
          (async()=>{
            for(const city of cities){
              let resolved=null;
              for(const lang of ['es','en']){
                const p=await page(lang,city);if(!p)continue;
                const safe=p.pageimage&&p.thumbnail?.source&&!reject.test(p.pageimage)&&!/\.svg$/i.test(p.pageimage);
                if(safe){resolved={lang,title:p.title,file:p.pageimage};break}
              }
              if(!resolved&&city==='Abu Dabi') resolved={lang:'en',title:'Abu Dhabi',file:'Abu_dhabi_skylines_2014.jpg'};
              if(!resolved) throw new Error(`${city}: no safe exact-article city lead`);
              console.log(`${city} -> ${resolved.lang}:${resolved.title} -> ${resolved.file}`);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
