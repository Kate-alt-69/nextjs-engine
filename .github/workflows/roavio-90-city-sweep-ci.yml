name: Roavio official image map

on:
  push:
    branches:
      - proposal/roavio-ne

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify exact official Roavio image URLs
        run: node tests/roavio-official-image-map.mjs
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npx next build
