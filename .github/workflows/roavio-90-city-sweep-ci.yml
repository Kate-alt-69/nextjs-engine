name: Roavio 90-city sweep

on:
  push:
    branches:
      - proposal/roavio-ne

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize two city photos per destination
        if: contains(github.event.head_commit.message, 'ci: materialize Roavio media')
        env:
          ROAVIO_MEDIA_PAUSE_MS: "220"
          ROAVIO_MEDIA_RETRIES: "6"
        run: node tests/roavio-media-materialize.mjs
      - name: Commit generated media manifest
        if: contains(github.event.head_commit.message, 'ci: materialize Roavio media')
        shell: bash
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add app/roavio/city-media.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "content: materialize Roavio city media"
            git push origin HEAD:proposal/roavio-ne
          fi
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npx next build
      - name: Start production server
        shell: bash
        run: |
          (npm run start -- -p 3100 > /tmp/roavio-next.log 2>&1 & echo $! > /tmp/roavio-next.pid)
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3100/cities >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roavio-next.log
          exit 1
      - name: Sweep all 90 city routes and both photo slots
        env:
          ROAVIO_BASE_URL: http://127.0.0.1:3100
          ROAVIO_SWEEP_CONCURRENCY: "3"
          ROAVIO_SWEEP_TIMEOUT_MS: "20000"
        run: node tests/roavio-city-sweep.mjs
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/roavio-next.log || true
