name: Roavio dossier composition CI

on:
  push:
    branches:
      - proposal/roavio-ne

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply dossier composition patch
        run: python3 scripts/roavio-dossier-composition.py

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npx next build

      - name: Commit validated dossier composition
        shell: bash
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add app/roavio/CityDossier.tsx app/roavio/CityDossierBackdrop.tsx app/roavio/city-hero.css
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore dual-photo city dossier composition"
            git push origin HEAD:proposal/roavio-ne
          fi
