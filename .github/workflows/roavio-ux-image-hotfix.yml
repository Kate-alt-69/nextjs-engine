name: Roavio UX image hotfix

on:
  push:
    branches:
      - proposal/roavio-ne
    paths:
      - scripts/roavio-ux-image-hotfix.py
      - .github/workflows/roavio-ux-image-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: proposal/roavio-ne
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply hotfix
        run: python3 scripts/roavio-ux-image-hotfix.py

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npx next build

      - name: Commit validated changes
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add app/cities/page.tsx app/roavio/ClientWidgets.tsx app/roavio/CityThumb.tsx app/roavio/CityDossier.tsx app/roavio/theme.ts app/roavio/city-hero.css next.config.js
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "fix: refine Roavio city browsing and image loading"
            git push origin HEAD:proposal/roavio-ne
          fi
