name: Engine runtime CI

on:
  push:
    branches: [main, 3_gen_main]
  pull_request:
    branches: [main, 3_gen_main]

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test APIStatic compiler
        run: |
          node scripts/api-static-smoke.js
          node scripts/api-static-artifact-smoke.js
      - name: Test EngineShader compiler and runtime
        run: |
          node scripts/engine-shader-smoke.js
          node scripts/engine-shader-runtime-smoke.js
      - name: Test EngineBrowser SSR safety
        run: node scripts/engine-browser-smoke.js
      - name: Test EngineCanvas high-refresh timing
        run: node scripts/engine-canvas-262-smoke.js
      - name: Test EngineTransitions presets and compatibility
        run: |
          node scripts/engine-transitions-smoke.js
          node scripts/engine-transitions-compat-smoke.js
      - name: Test EngineScroll core
        run: |
          node scripts/engine-scroll-smoke.js
          node scripts/engine-scroll-progress-smoke.js
          node scripts/engine-scroll-262-smoke.js
      - name: Test EngineOverlay runtime
        run: node scripts/engine-overlay-smoke.js
      - name: Test style compiler and primitive precedence
        run: |
          node scripts/style-compiler-smoke.js
          node scripts/primitive-style-precedence-smoke.js
      - name: Test React and Next compatibility contracts
        run: node scripts/react-runtime-compat-smoke.js
      - name: Test Generation 3 phase A/B contracts
        if: github.ref_name == '3_gen_main' || github.base_ref == '3_gen_main'
        run: node scripts/gen3-phase-ab-smoke.js
      - name: Test Generation 3 phase C contracts
        if: github.ref_name == '3_gen_main' || github.base_ref == '3_gen_main'
        run: |
          node scripts/gen3-phase-c-smoke.js
          node scripts/gen3-nenc-wire-smoke.js
      - name: Type-check engine
        run: npm run type-check
      - name: Build Next.js integration app
        run: npx next build
      - name: Report production client bundle sizes
        shell: bash
        run: |
          set -euo pipefail
          chunk_dir="dist/static/chunks"
          test -d "$chunk_dir"
          echo "Largest client JavaScript chunks:"
          find "$chunk_dir" -type f -name '*.js' -printf '%s %p\n' \
            | sort -nr \
            | awk 'NR <= 20 { printf "%8.1f KiB  %s\n", $1 / 1024, $2 }'
          total_bytes="$(find "$chunk_dir" -type f -name '*.js' -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          chunk_count="$(find "$chunk_dir" -type f -name '*.js' | wc -l | tr -d ' ')"
          printf 'Total client JavaScript: %.1f KiB across %s chunks\n' "$(awk -v bytes="$total_bytes" 'BEGIN { print bytes / 1024 }')" "$chunk_count"
