name: Roavio polish CI

on:
  push:
    branches: [proposal/roavio-ne]
    paths:
      - "app/**"
      - "public/roavio-wordmark.svg"
      - "next.config.js"
      - ".github/workflows/roavio-polish-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npx next build
