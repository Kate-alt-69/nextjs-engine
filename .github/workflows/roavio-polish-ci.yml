name: Roavio polish CI

on:
  push:
    branches: [proposal/roavio-ne]
    paths:
      - "app/**"
      - "public/roavio-wordmark.svg"
      - "next.config.js"
      - ".github/workflows/roavio-polish-ci.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair syntax caught by first validation pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          visuals = Path('app/roavio/visuals.ts')
          text = visuals.read_text()
          text = text.replace('\n  san-francisco:', '\n  "san-francisco":')
          visuals.write_text(text)

          home = Path('app/page.tsx')
          text = home.read_text()
          needle = '''              ].map(([number, title, body]) => ({
                type: "card", key: number, props: { variant: "flat", innerPadding: "1rem", bg: "var(--rv-card)", border: "1px solid var(--rv-line)", borderRadius: "20px" }, children: [
                  { type: "text", props: { content: number, variant: "overline", color: "var(--rv-green)", weight: 800 } },
                  { type: "text", props: { content: title, size: "1.05rem", weight: 800, mt: ".65rem" } },
                  { type: "text", props: { content: body, size: ".82rem", color: "var(--rv-muted)", lineHeight: 1.6, mt: ".4rem" } },
                ],
              })),
            ],'''
          replacement = needle[:-2] + '''  },
            ],'''
          if needle in text:
              text = text.replace(needle, replacement, 1)
          home.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npx next build
      - name: Commit validated repairs
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx app/roavio/visuals.ts
          if git diff --cached --quiet; then
            echo "Syntax repairs already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: repair Roavio polish syntax"
          git push origin HEAD:proposal/roavio-ne
