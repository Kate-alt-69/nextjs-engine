          s = p.read_text()
          old_toggle = re.search(r'    \.rv-theme-toggle\{[^\n]*\}', s)
          if not old_toggle:
              raise SystemExit('theme toggle CSS not found')
          new_toggle = "    .rv-footer-theme-slot{display:flex;align-items:center;justify-content:flex-end;min-height:40px;flex:0 0 auto}.rv-theme-toggle{position:static;z-index:auto;border:1px solid var(--rv-line);border-radius:999px;padding:.25rem .62rem .25rem .25rem;background:var(--rv-card-soft);color:var(--rv-ink);box-shadow:none;backdrop-filter:none;display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;font-size:.72rem;font-weight:800;transition:background .2s ease,border-color .2s ease,transform .2s ease}.rv-theme-toggle:hover{border-color:color-mix(in srgb,var(--rv-green) 44%,var(--rv-line));background:color-mix(in srgb,var(--rv-card-soft) 82%,var(--rv-green) 18%)}.rv-theme-toggle:active{transform:scale(.97)}.rv-theme-toggle canvas{display:block}"
          s = s[:old_toggle.start()] + new_toggle + s[old_toggle.end():]
          s = s.replace('.rv-theme-toggle--consent{bottom:12.5rem}', '')
          old_footer = '{ type: "text", props: { content: copyFor(locale).footer, color: "var(--rv-muted)", size: ".76rem" } },'
          new_footer = old_footer + '\n        { type: "box", props: { id: "rv-footer-theme-slot", className: "rv-footer-theme-slot" } },'
          if old_footer not in s:
              raise SystemExit('footer text node anchor missing')
          s = s.replace(old_footer, new_footer, 1)
          p.write_text(s)

          # ── Explorer: 18 desktop / 12 mobile cards, actual page mounting ──
          p = Path('app/roavio/ClientWidgets.tsx')
          s = p.read_text()
          s = s.replace('import { useMemo, useState, useEffect, type FormEvent } from "react";', 'import { useMemo, useState, useEffect, type FormEvent } from "react";')
          state_anchor = '  const [sort, setSort] = useState("fit");\n  const [compare, setCompare] = useState<string[]>([]);'
          state_new = '  const [sort, setSort] = useState("fit");\n  const [page, setPage] = useState(0);\n  const [pageSize, setPageSize] = useState(18);\n  const [compare, setCompare] = useState<string[]>([]);'
          if state_anchor not in s:
              raise SystemExit('Explorer state anchor missing')
          s = s.replace(state_anchor, state_new, 1)

          effect_anchor = '''  useEffect(() => {
    if (initialSearch) return;
    const fromUrl = new URLSearchParams(window.location.search).get("search");
    if (fromUrl) setQuery(fromUrl);
  }, [initialSearch]);
'''
          effect_new = effect_anchor + '''
  useEffect(() => {
    const mobile = window.matchMedia("(max-width: 700px)");
    const syncPageSize = () => setPageSize(mobile.matches ? 12 : 18);
    syncPageSize();
    mobile.addEventListener?.("change", syncPageSize);
    return () => mobile.removeEventListener?.("change", syncPageSize);
  }, []);

  useEffect(() => {
    setPage(0);
  }, [query, continent, beachOnly, sort, pageSize]);
'''
          if effect_anchor not in s:
              raise SystemExit('Explorer URL effect anchor missing')
          s = s.replace(effect_anchor, effect_new, 1)

          results_end = '''  }, [catalog, query, continent, beachOnly, sort, locale]);

  const toggleCompare = (slug: string) => {'''
          pagination_logic = '''  }, [catalog, query, continent, beachOnly, sort, locale]);

  const pageCount = Math.max(1, Math.ceil(results.length / pageSize));
  const safePage = Math.min(page, pageCount - 1);
  const visibleResults = results.slice(safePage * pageSize, safePage * pageSize + pageSize);
  const pageNumbers = Array.from({ length: pageCount }, (_, index) => index);
  const rangeStart = results.length ? safePage * pageSize + 1 : 0;
  const rangeEnd = Math.min(results.length, safePage * pageSize + pageSize);

  useEffect(() => {
    if (page !== safePage) setPage(safePage);
  }, [page, safePage]);

  const goToPage = (nextPage: number) => {
    const bounded = Math.max(0, Math.min(pageCount - 1, nextPage));
    setPage(bounded);
    window.requestAnimationFrame(() => {
      const target = document.getElementById("rv-city-results");
      if (!target) return;
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      target.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
    });
  };

  const toggleCompare = (slug: string) => {'''
          if results_end not in s:
              raise SystemExit('Explorer results end anchor missing')
          s = s.replace(results_end, pagination_logic, 1)

          info_old = '<p style={{ color: "var(--rv-muted)", margin: ".55rem 0 1rem", fontSize: ".86rem" }}>{results.length} {copy.destinations} · {catalog.length} {copy.catalog} · {copy.compareHint}</p>\n      <div className="rv-result-grid">\n        {results.map((city) => ('
          info_new = '<p style={{ color: "var(--rv-muted)", margin: ".55rem 0 1rem", fontSize: ".86rem" }}>{results.length} {copy.destinations} · {catalog.length} {copy.catalog} · {copy.compareHint} · {locale === "es" ? `mostrando ${rangeStart}–${rangeEnd}` : `showing ${rangeStart}–${rangeEnd}`}</p>\n      <div className="rv-cities-folder">\n        {pageCount > 1 ? (\n          <div className="rv-cities-folder__tabs" role="navigation" aria-label={locale === "es" ? "Páginas de destinos" : "Destination pages"}>\n            {pageNumbers.map((pageIndex) => (\n              <button key={pageIndex} type="button" className="rv-cities-page-tab" data-active={pageIndex === safePage} aria-current={pageIndex === safePage ? "page" : undefined} onClick={() => goToPage(pageIndex)}>\n                <span>{locale === "es" ? "Pág." : "Page"}</span> {pageIndex + 1}\n              </button>\n            ))}\n          </div>\n        ) : null}\n        <div className="rv-result-grid" id="rv-city-results">\n        {visibleResults.map((city) => ('
          if info_old not in s:
              raise SystemExit('Explorer result grid anchor missing')
          s = s.replace(info_old, info_new, 1)

          grid_close_old = '''        ))}
      </div>
      {results.length === 0 ? ('''
          grid_close_new = '''        ))}
        </div>
        {pageCount > 1 ? (
          <div className="rv-cities-folder__footer">
            <button type="button" className="rv-cities-page-nav" disabled={safePage === 0} onClick={() => goToPage(safePage - 1)}>← {locale === "es" ? "Anterior" : "Previous"}</button>
            <span>{locale === "es" ? "Página" : "Page"} <strong>{safePage + 1}</strong> / {pageCount}</span>
            <button type="button" className="rv-cities-page-nav" disabled={safePage >= pageCount - 1} onClick={() => goToPage(safePage + 1)}>{locale === "es" ? "Siguiente" : "Next"} →</button>
          </div>
        ) : null}
      </div>
      {results.length === 0 ? ('''
          if grid_close_old not in s:
              raise SystemExit('Explorer grid close anchor missing')
          s = s.replace(grid_close_old, grid_close_new, 1)
          p.write_text(s)

          # ── Folder-pagination visual layer ──
          p = Path('app/roavio/responsive-v2.css')
          s = p.read_text()
          pagination_css = '''

/* Paged destination directory: only the current sheet is mounted. */
.rv-cities-folder{position:relative;margin-top:.25rem;padding:.8rem;border:1px solid var(--rv-line);border-radius:0 24px 24px 24px;background:color-mix(in srgb,var(--rv-card) 82%,transparent);box-shadow:0 18px 50px color-mix(in srgb,var(--rv-shadow) 70%,transparent)}
.rv-cities-folder__tabs{display:flex;align-items:flex-end;gap:.25rem;overflow-x:auto;margin:-2.55rem -.8rem .8rem;padding:1.75rem .8rem 0;scrollbar-width:none}
.rv-cities-folder__tabs::-webkit-scrollbar{display:none}
.rv-cities-page-tab{flex:0 0 auto;border:1px solid var(--rv-line);border-bottom-color:var(--rv-line);border-radius:12px 12px 4px 4px;padding:.5rem .68rem;background:var(--rv-card-soft);color:var(--rv-muted);font-size:.75rem;font-weight:800;cursor:pointer;transition:transform .16s ease,background .16s ease,color .16s ease,border-color .16s ease}
.rv-cities-page-tab span{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;opacity:.72}
.rv-cities-page-tab[data-active='true']{transform:translateY(1px);background:var(--rv-card);color:var(--rv-ink);border-color:color-mix(in srgb,var(--rv-green) 38%,var(--rv-line));border-bottom-color:var(--rv-card)}
.rv-cities-folder__footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.75rem;margin-top:.85rem;padding-top:.75rem;border-top:1px solid var(--rv-line);color:var(--rv-muted);font-size:.78rem}
.rv-cities-folder__footer>span{text-align:center}
.rv-cities-page-nav{justify-self:start;border:1px solid var(--rv-line);border-radius:11px;background:var(--rv-card);color:var(--rv-ink);padding:.55rem .72rem;font-weight:750;cursor:pointer}
.rv-cities-page-nav:last-child{justify-self:end}
.rv-cities-page-nav:disabled{opacity:.38;cursor:not-allowed}
.rv-cities-page-nav:not(:disabled):hover{border-color:color-mix(in srgb,var(--rv-green) 45%,var(--rv-line));background:var(--rv-card-soft)}
'''
          marker = '@media (max-width:819px){'
          if marker not in s:
              raise SystemExit('responsive mobile marker missing')
          s = s.replace(marker, pagination_css + '\n' + marker, 1)
          mobile_extra = '''
  .rv-cities-folder{padding:.55rem;border-radius:0 18px 18px 18px}
  .rv-cities-folder__tabs{margin:-2.35rem -.55rem .6rem;padding:1.6rem .55rem 0}
  .rv-cities-page-tab{padding:.48rem .62rem}
  .rv-cities-folder__footer{grid-template-columns:1fr 1fr;gap:.45rem}
  .rv-cities-folder__footer>span{grid-column:1/-1;grid-row:1;text-align:center}
  .rv-cities-page-nav{grid-row:2;width:100%;justify-content:center}
  .rv-footer-theme-slot{justify-content:flex-start}
'''
          mobile_anchor = '  .rv-explore-hero-section{\n'
          if mobile_anchor not in s:
              raise SystemExit('mobile CSS insertion anchor missing')
          s = s.replace(mobile_anchor, mobile_extra + '\n' + mobile_anchor, 1)
          p.write_text(s)

          # ── Real Roavio mobile drawer trigger: 3 lines ↔ X using EngineManim ──
          p = Path('app/roavio/RoavioMobileNav.tsx')
          s = p.read_text()
          import_anchor = 'import { EngineDrawer, EngineManim, EngineTransitionLink } from "@/engine";'
          s = s.replace(import_anchor, import_anchor + '\nimport { EngineNavManimIcon } from "@/src/engine/components/EngineNavManimIcon";')
          s = s.replace('  const [open, setOpen] = useState(false);', '  const [open, setOpen] = useState(false);\n  const [menuTouched, setMenuTouched] = useState(false);')
          s = s.replace('        onOpenChange={setOpen}', '        onOpenChange={(next) => { setMenuTouched(true); setOpen(next); }}')
          old_trigger = '''        trigger={(
          <span className="rv-mobile-nav-trigger__icon" aria-hidden="true">
            <span />
            <span />
          </span>
        )}'''
          new_trigger = '''        trigger={(
          <span className="rv-mobile-nav-trigger__icon" aria-hidden="true">
            {menuTouched ? (
              <EngineNavManimIcon open={open} size={22} />
            ) : (
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <path d="M4 6h14M4 11h14M4 16h14" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" />
              </svg>
            )}
          </span>
        )}'''
          if old_trigger not in s:
              raise SystemExit('Roavio mobile trigger anchor missing')
          s = s.replace(old_trigger, new_trigger, 1)
          p.write_text(s)

          p = Path('app/roavio/mobile-nav.css')
          s = p.read_text()
          s = re.sub(r'  \.rv-mobile-nav-trigger__icon\{[^\n]*\}\n  \.rv-mobile-nav-trigger__icon span\{[^\n]*\}\n  \.rv-mobile-nav-trigger__icon span:first-child\{[^\n]*\}\n  \.rv-mobile-nav-trigger__icon span:last-child\{[^\n]*\}', '  .rv-mobile-nav-trigger__icon{position:relative;width:22px;height:22px;display:grid;place-items:center;color:inherit}\n  .rv-mobile-nav-trigger__icon>span,.rv-mobile-nav-trigger__icon canvas,.rv-mobile-nav-trigger__icon svg{display:block!important;width:22px!important;height:22px!important}', s, count=1)
          p.write_text(s)
          PY
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run type-check
      - run: npx next build
      - name: Commit validated proposal UX pass
        shell: bash
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add app/roavio/PreferencesShell.tsx app/roavio/theme.ts app/roavio/ClientWidgets.tsx app/roavio/responsive-v2.css app/roavio/RoavioMobileNav.tsx app/roavio/mobile-nav.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: page city explorer and dock theme control"
          git push origin HEAD:proposal/roavio-ne
