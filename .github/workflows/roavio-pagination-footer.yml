name: Roavio paged Explorer + footer theme

on:
  push:
    branches:
      - proposal/roavio-ne
    paths:
      - ".github/workflows/roavio-pagination-footer.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply proposal UX patch
        run: python .github/patch-roavio-pagination-footer.py
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run type-check
      - run: npx next build
      - name: Commit validated proposal UX pass
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add app/roavio/PreferencesShell.tsx app/roavio/theme.ts app/roavio/ClientWidgets.tsx app/roavio/responsive-v2.css app/roavio/RoavioMobileNav.tsx app/roavio/mobile-nav.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: page city explorer and dock theme control"
          git push origin HEAD:proposal/roavio-ne
