name: Materialize Roavio content

on:
  push:
    branches: [proposal/roavio-ne]
    paths:
      - "content/cities/.scrape/**"
      - "scripts/roavio-materialize-scrape.js"
      - ".github/workflows/roavio-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Expand scraped city content
        run: node scripts/roavio-materialize-scrape.js
      - name: Commit generated city folders
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/cities; then
            echo "City content is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/cities
          git commit -m "content: materialize scraped Roavio city guides"
          git push origin HEAD:proposal/roavio-ne
