name: Roavio dark image fix

on:
  push:
    branches:
      - proposal/roavio-ne
    paths:
      - scripts/roavio-dark-image-fix.py
      - .github/workflows/roavio-dark-image-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: proposal/roavio-ne
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply fixes
        run: python scripts/roavio-dark-image-fix.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add app/page.tsx app/roavio/CityDossier.tsx app/roavio/CityThumb.tsx app/api/city-photo/route.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: correct dark contrast and city photo fallbacks"
          git push origin HEAD:proposal/roavio-ne
