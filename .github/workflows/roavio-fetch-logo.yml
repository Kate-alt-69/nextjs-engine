name: Fetch official Roavio logo

on:
  push:
    branches: [proposal/roavio-ne]
    paths:
      - ".github/workflows/roavio-fetch-logo.yml"

permissions:
  contents: write

jobs:
  fetch-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/roavio-ne
      - name: Fetch official icon
        run: |
          set -euo pipefail
          mkdir -p public
          curl -L --fail --retry 3 --connect-timeout 10 \
            https://www.roavio.es/logo-icon.png \
            -o public/roavio-logo-icon.png
          test -s public/roavio-logo-icon.png
          file public/roavio-logo-icon.png
      - name: Commit official asset
        run: |
          set -euo pipefail
          if git diff --quiet -- public/roavio-logo-icon.png && git ls-files --error-unmatch public/roavio-logo-icon.png >/dev/null 2>&1; then
            echo "Official logo already present"
            exit 0
          fi
          git config user.name "Kate"
          git config user.email "dhwanksh2000@gmail.com"
          git add public/roavio-logo-icon.png
          git commit -m "assets: add official Roavio logo icon"
          git push origin HEAD:proposal/roavio-ne
